<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SureDesk · 电商智能客服</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9ede6;
      --surface: #fbfbf7;
      --surface-raised: #ffffff;
      --ink: #17211c;
      --muted: #64716a;
      --line: #d3dbd1;
      --line-strong: #bcc7ba;
      --pine: #1c4a3b;
      --pine-dark: #123126;
      --pine-soft: #dfe9e2;
      --signal: #cf4a2f;
      --signal-soft: #f6e2dc;
      --amber: #a86f1b;
      --shadow: 0 30px 70px rgba(18, 49, 38, 0.16);
      --serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif CJK SC", serif;
      --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
      --mono: "SF Mono", "Menlo", "Consolas", monospace;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background-color: var(--canvas);
      background-image:
        linear-gradient(rgba(23, 33, 28, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 28, 0.035) 1px, transparent 1px);
      background-size: 34px 34px;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, input { font: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 3px;
    }

    .app {
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      width: min(1240px, calc(100vw - 48px));
      height: min(880px, calc(100dvh - 48px));
      margin: 24px auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      box-shadow: var(--shadow);
      animation: app-in 520ms cubic-bezier(0.22, 0.8, 0.3, 1) both;
    }

    @keyframes app-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .rail {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding: 30px 26px 24px;
      color: #f3f6f1;
      background-color: var(--pine);
      background-image: radial-gradient(rgba(255, 255, 255, 0.075) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .rail::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      color: #fff;
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1;
      transform: rotate(-3deg);
      box-shadow: inset 0 0 0 3px var(--pine), inset 0 0 0 4px rgba(255, 255, 255, 0.26);
    }

    .brand-name {
      font-family: var(--serif);
      font-size: 25px;
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .brand-sub {
      margin-top: 5px;
      color: rgba(243, 246, 241, 0.62);
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: rgba(243, 246, 241, 0.92);
      font-size: 12px;
    }

    .status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #86d6a8;
      box-shadow: 0 0 0 4px rgba(134, 214, 168, 0.16);
    }

    .status-note {
      width: 100%;
      padding-left: 19px;
      color: rgba(243, 246, 241, 0.52);
      font-size: 11px;
    }

    .rail-nav {
      display: flex;
      flex-direction: column;
      margin: 2px 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .rail-link {
      display: block;
      width: 100%;
      padding: 14px 2px;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      background: transparent;
      color: #f3f6f1;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
    }

    .rail-link span {
      display: block;
      margin-top: 4px;
      color: rgba(243, 246, 241, 0.5);
      font-size: 11px;
    }

    .rail-link:hover { color: #fff; }
    .rail-link:hover span { color: rgba(255, 255, 255, 0.74); }

    .rail-note {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(243, 246, 241, 0.6);
      font-size: 12px;
      line-height: 1.65;
    }

    .rail-note-title {
      margin: 0 0 6px;
      color: #f3f6f1;
      font-size: 12px;
    }

    .rail-note p { margin: 0; }

    .rail-foot {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .workbench-link {
      color: #fff;
      font-size: 13px;
      text-decoration-color: rgba(255, 255, 255, 0.45);
      text-underline-offset: 4px;
    }

    .workbench-link span { color: #9fd0b7; }

    .rail-foot p {
      margin: 0;
      color: rgba(243, 246, 241, 0.42);
      font-family: var(--mono);
      font-size: 10px;
    }

    .main {
      display: flex;
      min-height: 0;
      min-width: 0;
      flex-direction: column;
      background: var(--surface);
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 30px 17px;
      border-bottom: 1px solid var(--line);
    }

    .topbar-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
    }

    .topbar-meta {
      margin: 5px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 11px;
    }

    .secure {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .secure svg { width: 13px; height: 13px; }

    .mobile-workbench { display: none; color: var(--pine); }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 30px 34px 18px;
      scroll-behavior: smooth;
    }

    .welcome {
      padding: 2px 0 28px;
      border-bottom: 1px solid var(--line);
      transition: padding 240ms ease;
    }

    .welcome h1 {
      max-width: none;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(32px, 3.4vw, 43px);
      font-weight: 500;
      line-height: 1.16;
      letter-spacing: -0.015em;
    }

    .welcome > p {
      max-width: 56ch;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .prompts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 22px;
    }

    .prompt {
      padding: 12px 13px 13px;
      border: 1px solid var(--line);
      border-top: 2px solid var(--pine);
      border-radius: 2px 2px 8px 8px;
      background: var(--surface-raised);
      color: var(--ink);
      text-align: left;
      font-size: 12px;
      line-height: 1.45;
      cursor: pointer;
    }

    .prompt span {
      display: block;
      margin-bottom: 5px;
      color: var(--signal);
      font-size: 10px;
      letter-spacing: 0.1em;
    }

    .prompt:hover { border-color: var(--pine); background: #f7faf5; }

    .messages.has-thread .welcome {
      padding: 0;
      border-bottom: 0;
    }

    .messages.has-thread .welcome h1,
    .messages.has-thread .welcome > p,
    .messages.has-thread .prompts { display: none; }

    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      margin: 24px 0 0;
    }

    .msg-row:first-of-type { margin-top: 0; }
    .msg-row.user { justify-content: flex-end; }

    .avatar {
      display: grid;
      flex: 0 0 30px;
      place-items: center;
      width: 30px;
      height: 30px;
      margin-top: 20px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: var(--surface-raised);
      color: var(--pine);
      font-family: var(--serif);
      font-size: 15px;
    }

    .bubble { max-width: 78%; min-width: 0; }
    .msg-row.user .bubble { max-width: 72%; }

    .bubble-head {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin: 0 2px 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .bubble-head strong {
      color: var(--ink);
      font-weight: 600;
    }

    .msg-row.user .bubble-head { justify-content: flex-end; }

    .bubble-body {
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--pine);
      border-radius: 2px 10px 10px 10px;
      background: var(--surface-raised);
      font-size: 14px;
      line-height: 1.72;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-row.user .bubble-body {
      border: 0;
      border-radius: 10px 2px 10px 10px;
      background: var(--pine);
      color: #f6faf4;
    }

    .answer.error { color: var(--signal); }

    .thought {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .thought summary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      list-style: none;
    }

    .thought summary::-webkit-details-marker { display: none; }

    .thought summary::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--amber);
    }

    .thought.is-live summary::before { animation: pulse 1.1s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .thought-text {
      margin: 7px 0 0 12px;
      line-height: 1.6;
    }

    .evidence {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .cite {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border: 1px solid #c6d7ca;
      border-radius: 999px;
      background: var(--pine-soft);
      color: var(--pine);
      font-size: 10px;
    }

    .cite::before {
      content: "§";
      font-family: var(--serif);
      font-size: 12px;
    }

    .feedback-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
    }

    .feedback-btn {
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 3px;
    }

    .feedback-btn:hover { color: var(--pine); text-decoration-color: var(--pine); }
    .feedback-btn.is-selected { color: var(--signal); text-decoration-color: var(--signal); }

    .notice {
      margin-top: 20px;
      padding: 16px 18px;
      border: 1px solid #e5c9bf;
      border-left: 3px solid var(--signal);
      background: #fdf5f2;
      font-size: 13px;
      line-height: 1.7;
    }

    .notice strong { display: block; margin-bottom: 4px; }
    .notice p { margin: 0; color: var(--muted); }
    .notice code {
      display: block;
      margin-top: 10px;
      padding: 9px 10px;
      overflow-x: auto;
      background: #fff;
      border: 1px solid #ecd6ce;
      color: var(--signal);
      font-family: var(--mono);
      font-size: 10px;
      white-space: nowrap;
    }

    .composer {
      padding: 14px 30px 18px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .composer-box {
      padding: 10px 12px 9px;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      background: var(--surface-raised);
      box-shadow: 0 1px 0 rgba(18, 49, 38, 0.04);
    }

    .composer-box:focus-within {
      border-color: var(--pine);
      box-shadow: 0 0 0 3px rgba(28, 74, 59, 0.08);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 26px;
      max-height: 122px;
      padding: 2px 2px 6px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font-size: 14px;
      line-height: 1.55;
    }

    textarea::placeholder { color: #8c9790; }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 7px;
      border-top: 1px solid #edf0eb;
    }

    .hint { color: var(--muted); font-size: 10px; }

    .send {
      padding: 9px 19px;
      border: 0;
      border-radius: 8px;
      background: var(--signal);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .send:hover { background: #b83f27; }
    .send:disabled { background: #d8b2a8; cursor: progress; }

    .footnote {
      margin: 9px 0 0;
      color: #8c9790;
      text-align: center;
      font-size: 10px;
    }

    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      z-index: 20;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 980px) {
      .app { grid-template-columns: 250px minmax(0, 1fr); }
      .rail { padding: 26px 20px 22px; }
      .prompts { grid-template-columns: 1fr; }
      .prompt:nth-child(2), .prompt:nth-child(3) { display: none; }
    }

    @media (max-width: 820px) {
      body { background-image: none; }
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        width: 100%;
        height: 100dvh;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .rail {
        flex-direction: row;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
      }
      .rail::after, .rail-nav, .rail-note, .status-note, .rail-foot p { display: none; }
      .brand-mark { width: 32px; height: 32px; font-size: 18px; }
      .brand-name { font-size: 20px; }
      .brand-sub { display: none; }
      .status { margin-left: auto; font-size: 11px; }
      .rail-foot { display: none; }
      .workbench-link { font-size: 11px; }
      .topbar { padding: 14px 18px; }
      .mobile-workbench { display: inline; }
      .messages { padding: 20px 18px 12px; }
      .welcome h1 { font-size: 30px; }
      .bubble { max-width: 88%; }
      .msg-row.user .bubble { max-width: 84%; }
      .composer { padding: 12px 16px max(14px, env(safe-area-inset-bottom)); }
      .composer-actions { justify-content: flex-end; }
      .hint { display: none; }
    }

    @media (max-width: 520px) {
      .topbar-right .secure { display: none; }
      .prompts { margin-top: 18px; }
      .avatar { display: none; }
      .bubble, .msg-row.user .bubble { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div>
          <div class="brand-name">SureDesk</div>
          <div class="brand-sub">电商客服台</div>
        </div>
      </div>

      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        客服在线
        <span class="status-note">平均 3 秒响应 · 身份已加密</span>
      </div>

      <nav class="rail-nav" aria-label="常见咨询">
        <button class="rail-link" data-prompt="我的订单 order_1002 发货了吗？">订单到哪了<span>发货进度与物流轨迹</span></button>
        <button class="rail-link" data-prompt="签收超过 7 天还能退货吗？">退换货政策<span>七天无理由与例外情形</span></button>
        <button class="rail-link" data-prompt="我想申请退款，订单号是 order_1001。">申请退款<span>按平台规则核验资格</span></button>
      </nav>

      <div class="rail-note">
        <p class="rail-note-title">服务说明</p>
        <p>回答基于订单数据与售后知识库。涉及退款时，会按平台规则核验资格，不会直接作出承诺。</p>
      </div>

      <div class="rail-foot">
        <a class="workbench-link" href="/workbench">运营审核工作台 <span aria-hidden="true">↗</span></a>
        <p>SURE DESK / SERVICE 03</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="topbar-title">售后咨询</p>
          <p class="topbar-meta">会话 <span id="sessionLabel">sess_...</span></p>
        </div>
        <div class="topbar-right">
          <span class="secure">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 7V5.5a4 4 0 0 1 8 0V7M3.5 7h9v6h-9z" stroke="currentColor" stroke-width="1.2"/>
            </svg>
            安全连接
          </span>
          <a class="mobile-workbench" href="/workbench">审核台 ↗</a>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite">
        <section class="welcome" id="welcome">
          <h1>把问题留在这里，<br>剩下的我们来查。</h1>
          <p>订单、物流、退换货和售后政策，都可以直接问。涉及订单的回答会先核验你的身份，再给出有依据的结果。</p>
          <div class="prompts" aria-label="试试这样问">
            <button class="prompt" data-prompt="我的订单 order_1002 发货了吗？"><span>查物流</span>我的耳机到哪了？</button>
            <button class="prompt" data-prompt="签收超过 7 天还能退货吗？"><span>问政策</span>超过 7 天还能退吗？</button>
            <button class="prompt" data-prompt="我想申请退款，订单号是 order_1001。"><span>办退款</span>帮我申请一笔退款</button>
          </div>
        </section>
      </div>

      <div class="composer">
        <form class="composer-box" id="composerForm">
          <textarea id="userInput" rows="1" placeholder="写下你的问题，例如：订单 1002 到哪了？" autocomplete="off" aria-label="输入你的问题"></textarea>
          <div class="composer-actions">
            <span class="hint">Enter 发送 · Shift + Enter 换行</span>
            <button type="submit" class="send" id="sendBtn">发送</button>
          </div>
        </form>
        <p class="footnote">回答由 AI 生成，并经过知识库与订单数据核验。</p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const sessionId = "sess_" + Math.random().toString(36).substring(2, 8);
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const toastEl = document.getElementById("toast");
    const sessionLabel = document.getElementById("sessionLabel");
    const welcomeEl = document.getElementById("welcome");
    let isSending = false;
    let toastTimer = null;

    sessionLabel.textContent = sessionId;

    function getAuthenticatedUserId() {
      const token = localStorage.getItem("suredesk_access_token");
      if (!token) return null;
      try {
        const encodedPayload = token.split(".")[0];
        const normalizedPayload = encodedPayload.replace(/-/g, "+").replace(/_/g, "/");
        const paddedPayload = normalizedPayload.padEnd(Math.ceil(normalizedPayload.length / 4) * 4, "=");
        const payload = JSON.parse(atob(paddedPayload));
        return typeof payload.user_id === "string" ? payload.user_id : null;
      } catch (err) {
        return null;
      }
    }

    function getAuthHeaders(customHeaders = {}) {
      const headers = Object.assign({}, customHeaders);
      const token = localStorage.getItem("suredesk_access_token");
      if (token) {
        headers["Authorization"] = "Bearer " + token;
      }
      return headers;
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("is-visible"), 3200);
    }

    function currentTime() {
      return new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }

    function scrollToLatest() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function createMessage(role, label) {
      const row = document.createElement("article");
      row.className = "msg-row " + role;

      if (role === "bot") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = "S";
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const head = document.createElement("div");
      head.className = "bubble-head";
      const strong = document.createElement("strong");
      strong.textContent = label || (role === "bot" ? "SureDesk" : "我");
      const time = document.createElement("span");
      time.textContent = currentTime();
      head.appendChild(strong);
      head.appendChild(time);

      const body = document.createElement("div");
      body.className = "bubble-body";

      bubble.appendChild(head);
      bubble.appendChild(body);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      return { row, bubble, body };
    }

    function hideWelcome() {
      messagesEl.classList.add("has-thread");
      if (welcomeEl) welcomeEl.setAttribute("aria-hidden", "true");
    }

    function parseAndDispatchSseBlock(block, handlers) {
      const lines = block.split(/\r?\n/);
      let eventType = "message";
      const dataLines = [];

      for (const line of lines) {
        if (line.startsWith("event:")) {
          eventType = line.slice(6).trim();
        } else if (line.startsWith("data:")) {
          dataLines.push(line.slice(5).trim());
        }
      }

      if (dataLines.length === 0) return;
      const rawData = dataLines.join("\n");

      let payload;
      try {
        payload = JSON.parse(rawData);
      } catch (err) {
        payload = rawData;
      }

      if (eventType === "thought") {
        const thoughtText = typeof payload === "object" && payload ? (payload.thought || payload.content || "") : String(payload);
        if (thoughtText && handlers.onThought) handlers.onThought(thoughtText);
      } else if (eventType === "answer") {
        let chunk = "";
        if (typeof payload === "object" && payload) {
          chunk = payload.chunk !== undefined ? payload.chunk : (payload.content !== undefined ? payload.content : "");
        } else {
          chunk = String(payload);
        }
        if (chunk && handlers.onAnswerChunk) handlers.onAnswerChunk(chunk);
      } else if (eventType === "evidence") {
        if (handlers.onEvidence) handlers.onEvidence(payload);
      } else if (eventType === "error") {
        const errMsg = typeof payload === "object" && payload ? (payload.message || payload.error || "服务发生错误") : String(payload);
        if (handlers.onError) handlers.onError(errMsg);
      }
    }

    async function consumeSseStream(response, handlers) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundaryMatch;
        while ((boundaryMatch = buffer.match(/\r?\n\r?\n/)) !== null) {
          const boundaryIndex = boundaryMatch.index;
          const delimiterLength = boundaryMatch[0].length;
          const eventBlock = buffer.slice(0, boundaryIndex);
          buffer = buffer.slice(boundaryIndex + delimiterLength);
          parseAndDispatchSseBlock(eventBlock, handlers);
        }
      }

      if (buffer.trim()) parseAndDispatchSseBlock(buffer, handlers);
    }

    function renderEvidence(container, evidenceList) {
      if (!evidenceList || !Array.isArray(evidenceList) || evidenceList.length === 0) return;
      const titles = evidenceList
        .map(e => e.doc_title || e.title || (e.doc_id ? "文档 " + e.doc_id : ""))
        .filter(Boolean);
      if (titles.length === 0) return;
      container.replaceChildren();
      titles.forEach((title, index) => {
        const chip = document.createElement("span");
        chip.className = "cite";
        chip.textContent = (index + 1) + " · " + title;
        container.appendChild(chip);
      });
    }

    function showTokenNotice() {
      if (document.getElementById("tokenNotice")) return;
      const notice = document.createElement("div");
      notice.className = "notice";
      notice.id = "tokenNotice";

      const title = document.createElement("strong");
      title.textContent = "需要先配置访问令牌";
      const copy = document.createElement("p");
      copy.textContent = "在浏览器控制台执行下面的命令，把令牌换成你自己的，然后刷新页面。";
      const code = document.createElement("code");
      code.textContent = 'localStorage.setItem("suredesk_access_token", "你的令牌")';

      notice.appendChild(title);
      notice.appendChild(copy);
      notice.appendChild(code);
      messagesEl.appendChild(notice);
      scrollToLatest();
      showToast("未检测到访问令牌");
    }

    function createBotStream() {
      const message = createMessage("bot", "SureDesk");
      message.body.textContent = "";

      const thought = document.createElement("details");
      thought.className = "thought is-live";
      thought.open = true;
      const summary = document.createElement("summary");
      summary.textContent = "正在检索知识库与订单信息";
      const thoughtText = document.createElement("p");
      thoughtText.className = "thought-text";
      thoughtText.textContent = "正在确认身份与问题类型。";
      thought.appendChild(summary);
      thought.appendChild(thoughtText);
      message.body.appendChild(thought);

      const answer = document.createElement("div");
      answer.className = "answer";
      message.body.appendChild(answer);

      const evidence = document.createElement("div");
      evidence.className = "evidence";
      message.body.appendChild(evidence);

      return { message, thought, summary, thoughtText, answer, evidence };
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isSending) return;

      const userId = getAuthenticatedUserId();
      if (!userId) {
        showTokenNotice();
        return;
      }

      hideWelcome();
      inputEl.value = "";
      resizeInput();
      isSending = true;
      sendBtn.disabled = true;

      const userMessage = createMessage("user", "我");
      userMessage.body.textContent = text;
      scrollToLatest();

      const stream = createBotStream();
      let accumulatedAnswer = "";
      scrollToLatest();

      try {
        const headers = getAuthHeaders({ "Content-Type": "application/json" });
        const resp = await fetch("/api/chat/stream", {
          method: "POST",
          headers: headers,
          body: JSON.stringify({
            user_id: userId,
            session_id: sessionId,
            query: text,
            stream: true
          })
        });

        if (!resp.ok) throw new Error("HTTP error " + resp.status);

        const contentType = resp.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
          const data = await resp.json();
          if (data.thought) {
            stream.thoughtText.textContent = data.thought;
            stream.summary.textContent = "处理记录";
          }
          accumulatedAnswer = data.answer || "已收到您的提问。";
          stream.answer.textContent = accumulatedAnswer;
          if (data.evidence) renderEvidence(stream.evidence, data.evidence);
        } else if (resp.body && resp.body.getReader) {
          await consumeSseStream(resp, {
            onThought: (thoughtText) => {
              stream.thoughtText.textContent = thoughtText;
              scrollToLatest();
            },
            onAnswerChunk: (chunk) => {
              accumulatedAnswer += chunk;
              stream.answer.textContent = accumulatedAnswer;
              scrollToLatest();
            },
            onEvidence: (evidenceList) => {
              renderEvidence(stream.evidence, evidenceList);
              scrollToLatest();
            },
            onError: (errMsg) => {
              stream.answer.textContent = errMsg;
              stream.answer.classList.add("error");
              scrollToLatest();
            }
          });
        }

        if (!accumulatedAnswer && !stream.answer.textContent) {
          accumulatedAnswer = "已收到您的提问。";
          stream.answer.textContent = accumulatedAnswer;
        }

        stream.thought.classList.remove("is-live");
        stream.summary.textContent = "处理记录";
        stream.thought.open = false;

        const feedbackBar = document.createElement("div");
        feedbackBar.className = "feedback-bar";
        const prompt = document.createElement("span");
        prompt.textContent = "这个回答有帮助吗？";

        const thumbUpBtn = document.createElement("button");
        thumbUpBtn.className = "feedback-btn";
        thumbUpBtn.textContent = "有帮助";
        thumbUpBtn.addEventListener("click", () => {
          sendFeedback(true, text, accumulatedAnswer, feedbackBar);
        });

        const thumbDownBtn = document.createElement("button");
        thumbDownBtn.className = "feedback-btn";
        thumbDownBtn.textContent = "没解决";
        thumbDownBtn.addEventListener("click", () => {
          sendFeedback(false, text, accumulatedAnswer, feedbackBar);
        });

        feedbackBar.appendChild(prompt);
        feedbackBar.appendChild(thumbUpBtn);
        feedbackBar.appendChild(thumbDownBtn);
        stream.message.body.appendChild(feedbackBar);
      } catch (err) {
        stream.thought.classList.remove("is-live");
        stream.thought.open = false;
        stream.answer.textContent = "抱歉，服务暂时遇到一点问题，请稍后重试。";
        stream.answer.classList.add("error");
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        scrollToLatest();
      }
    }

    async function sendFeedback(useful, query, answer, barElement) {
      const userId = getAuthenticatedUserId();
      if (!userId) {
        showTokenNotice();
        return;
      }
      try {
        const headers = getAuthHeaders({ "Content-Type": "application/json" });
        await fetch("/api/feedback", {
          method: "POST",
          headers: headers,
          body: JSON.stringify({
            user_id: userId,
            session_id: sessionId,
            query: query,
            answer: answer || "",
            useful: useful
          })
        });

        if (barElement) {
          const buttons = barElement.querySelectorAll(".feedback-btn");
          buttons.forEach(btn => btn.disabled = true);
          const selected = useful ? buttons[0] : buttons[1];
          if (selected) selected.classList.add("is-selected");
        }
        showToast(useful ? "已记录：这个回答有帮助" : "已转入问题池，运营会继续补全答案");
      } catch (err) {
        showToast("反馈提交失败，请稍后重试");
      }
    }

    function resizeInput() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 122) + "px";
    }

    inputEl.addEventListener("input", resizeInput);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("composerForm").addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    document.querySelectorAll("[data-prompt]").forEach((button) => {
      button.addEventListener("click", () => {
        inputEl.value = button.getAttribute("data-prompt") || "";
        resizeInput();
        sendMessage();
      });
    });

    resizeInput();
  </script>
</body>
</html>
