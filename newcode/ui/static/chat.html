<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SureDesk</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9ede6;
      --surface: #fbfbf7;
      --white: #ffffff;
      --ink: #17211c;
      --muted: #6b776f;
      --line: #d3dbd1;
      --line-strong: #bcc7ba;
      --pine: #1c4a3b;
      --pine-dark: #123126;
      --pine-soft: #e1ebe3;
      --signal: #cf4a2f;
      --serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif CJK SC", serif;
      --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
      --mono: "SF Mono", "Menlo", "Consolas", monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background-color: var(--canvas);
      background-image:
        linear-gradient(rgba(23, 33, 28, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 28, 0.035) 1px, transparent 1px);
      background-size: 34px 34px;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea { font: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 3px;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: min(920px, calc(100vw - 40px));
      height: min(900px, calc(100dvh - 40px));
      margin: 20px auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      box-shadow: 0 30px 70px rgba(18, 49, 38, 0.15);
      animation: app-in 480ms cubic-bezier(0.22, 0.8, 0.3, 1) both;
    }

    @keyframes app-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .masthead {
      display: flex;
      flex: 0 0 64px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 26px;
      color: #f3f6f1;
      background-color: var(--pine);
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--serif);
      font-size: 23px;
      letter-spacing: 0.01em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1.5px solid rgba(255, 255, 255, 0.72);
      color: #fff;
      font-family: var(--serif);
      font-size: 19px;
      line-height: 1;
      transform: rotate(-3deg);
      box-shadow: inset 0 0 0 3px var(--pine), inset 0 0 0 4px rgba(255, 255, 255, 0.24);
    }

    .masthead-right {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 12px;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: rgba(243, 246, 241, 0.88);
    }

    .online::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8bd8ad;
      box-shadow: 0 0 0 4px rgba(139, 216, 173, 0.14);
    }

    .workbench-link {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      padding-bottom: 2px;
    }

    .workbench-link:hover { border-bottom-color: #fff; }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 42px 46px 26px;
      scroll-behavior: smooth;
    }

    .welcome { padding: 6px 0 30px; }

    .welcome h1 {
      max-width: none;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(38px, 5vw, 52px);
      font-weight: 500;
      line-height: 1.14;
      letter-spacing: -0.02em;
    }

    .prompts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
    }

    .prompt {
      position: relative;
      padding: 15px 14px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--white);
      color: var(--ink);
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .prompt::after {
      content: "";
      position: absolute;
      right: 12px;
      bottom: 10px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--signal);
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .prompt:hover {
      border-color: var(--pine);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 -3px var(--pine-soft);
    }

    .prompt:hover::after { opacity: 1; transform: scale(1); }

    .messages.has-thread .welcome { display: none; }

    .msg {
      display: flex;
      gap: 11px;
      margin-top: 24px;
      animation: msg-in 280ms cubic-bezier(0.22, 0.8, 0.3, 1) both;
    }

    .msg:first-child { margin-top: 0; }
    .msg.user { justify-content: flex-end; }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      display: grid;
      flex: 0 0 28px;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: var(--white);
      color: var(--pine);
      font-family: var(--serif);
      font-size: 14px;
    }

    .bubble {
      max-width: 78%;
      padding: 14px 17px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--pine);
      border-radius: 2px 12px 12px 12px;
      background: var(--white);
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      border: 0;
      border-radius: 12px 2px 12px 12px;
      background: var(--pine);
      color: #f6faf4;
    }

    .answer.error { color: var(--signal); }

    .retry {
      margin-top: 10px;
      padding: 6px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--white);
      color: var(--ink);
      font-size: 12px;
      cursor: pointer;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 18px;
      padding: 2px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pine);
      opacity: 0.35;
      animation: dot 1s ease-in-out infinite;
    }

    .typing span:nth-child(2) { animation-delay: 120ms; }
    .typing span:nth-child(3) { animation-delay: 240ms; }

    @keyframes dot {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    .evidence {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .cite {
      padding: 3px 8px;
      border: 1px solid #c6d7ca;
      border-radius: 999px;
      background: var(--pine-soft);
      color: var(--pine);
      font-size: 10px;
    }

    .cite::before {
      content: "§";
      margin-right: 4px;
      font-family: var(--serif);
      font-size: 12px;
    }

    .feedback-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 12px;
      animation: msg-in 220ms ease both;
    }

    .feedback-btn {
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
    }

    .feedback-btn:hover { color: var(--pine); border-bottom-color: var(--pine); }
    .feedback-btn.is-selected { color: var(--signal); border-bottom-color: var(--signal); }

    .stamp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--pine);
      font-size: 11px;
      animation: stamp-in 320ms cubic-bezier(0.2, 1.4, 0.4, 1) both;
    }

    .stamp::before {
      content: "✓";
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 1px solid var(--pine);
      border-radius: 50%;
      font-size: 11px;
    }

    @keyframes stamp-in {
      from { opacity: 0; transform: scale(0.7) rotate(-8deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    .notice {
      margin-top: 20px;
      padding: 16px 18px;
      border: 1px solid #e5c9bf;
      border-left: 3px solid var(--signal);
      background: #fdf5f2;
      font-size: 13px;
      line-height: 1.7;
    }

    .notice strong { display: block; margin-bottom: 6px; }

    .notice code {
      display: block;
      margin-top: 10px;
      padding: 9px 10px;
      overflow-x: auto;
      background: #fff;
      border: 1px solid #ecd6ce;
      color: var(--signal);
      font-family: var(--mono);
      font-size: 10px;
      white-space: nowrap;
    }

    .composer {
      flex: 0 0 auto;
      padding: 16px 26px 20px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 10px 10px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background: var(--white);
    }

    .composer-box:focus-within {
      border-color: var(--pine);
      box-shadow: 0 0 0 3px rgba(28, 74, 59, 0.08);
    }

    textarea {
      flex: 1;
      min-height: 26px;
      max-height: 120px;
      padding: 2px 0 4px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font-size: 14px;
      line-height: 1.55;
    }

    textarea::placeholder { color: #8c9790; }

    .send {
      flex: 0 0 auto;
      padding: 9px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--signal);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    .send:hover { background: #b83f27; }
    .send:active { transform: scale(0.96); }
    .send:disabled { background: #d8b2a8; cursor: progress; }

    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      z-index: 20;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 760px) {
      body { background-image: none; }
      .app {
        width: 100%;
        height: 100dvh;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .masthead { flex-basis: 56px; padding: 0 18px; }
      .brand { font-size: 20px; }
      .brand-mark { width: 30px; height: 30px; font-size: 17px; }
      .messages { padding: 28px 18px 18px; }
      .welcome h1 { font-size: 34px; }
      .prompts { grid-template-columns: 1fr; margin-top: 22px; }
      .bubble { max-width: 88%; }
      .composer { padding: 12px 16px max(14px, env(safe-area-inset-bottom)); }
      .avatar { display: none; }
      .msg.user .bubble { max-width: 84%; }
    }

    @media (max-width: 420px) {
      .online { display: none; }
      .bubble, .msg.user .bubble { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        SureDesk
      </div>
      <div class="masthead-right">
        <span class="online">在线</span>
        <a class="workbench-link" href="/workbench">审核台</a>
      </div>
    </header>

    <main class="messages" id="messages" aria-live="polite">
      <section class="welcome" id="welcome">
        <h1>把问题留在这里，<br>剩下的我们来查。</h1>
        <div class="prompts">
          <button class="prompt" data-prompt="我的订单 order_1002 发货了吗？">我的耳机到哪了？</button>
          <button class="prompt" data-prompt="签收超过 7 天还能退货吗？">超过 7 天还能退吗？</button>
          <button class="prompt" data-prompt="我想申请退款，订单号是 order_1001。">帮我申请一笔退款</button>
        </div>
      </section>
    </main>

    <div class="composer">
      <form class="composer-box" id="composerForm">
        <textarea id="userInput" rows="1" placeholder="问点什么…" autocomplete="off" aria-label="输入问题"></textarea>
        <button type="submit" class="send" id="sendBtn">发送</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const sessionId = "sess_" + Math.random().toString(36).substring(2, 8);
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const toastEl = document.getElementById("toast");
    const welcomeEl = document.getElementById("welcome");
    let isSending = false;
    let toastTimer = null;

    function getAuthenticatedUserId() {
      const token = localStorage.getItem("suredesk_access_token");
      if (!token) return null;
      try {
        const encodedPayload = token.split(".")[0];
        const normalizedPayload = encodedPayload.replace(/-/g, "+").replace(/_/g, "/");
        const paddedPayload = normalizedPayload.padEnd(Math.ceil(normalizedPayload.length / 4) * 4, "=");
        const payload = JSON.parse(atob(paddedPayload));
        return typeof payload.user_id === "string" ? payload.user_id : null;
      } catch (err) {
        return null;
      }
    }

    function getAuthHeaders(customHeaders = {}) {
      const headers = Object.assign({}, customHeaders);
      const token = localStorage.getItem("suredesk_access_token");
      if (token) {
        headers["Authorization"] = "Bearer " + token;
      }
      return headers;
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("is-visible"), 3000);
    }

    function scrollToLatest() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideWelcome() {
      messagesEl.classList.add("has-thread");
      if (welcomeEl) welcomeEl.setAttribute("aria-hidden", "true");
    }

    function createMessage(role) {
      const row = document.createElement("article");
      row.className = "msg " + role;

      if (role === "bot") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = "S";
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      return { row, bubble };
    }

    function parseAndDispatchSseBlock(block, handlers) {
      const lines = block.split(/\r?\n/);
      let eventType = "message";
      const dataLines = [];

      for (const line of lines) {
        if (line.startsWith("event:")) {
          eventType = line.slice(6).trim();
        } else if (line.startsWith("data:")) {
          dataLines.push(line.slice(5).trim());
        }
      }

      if (dataLines.length === 0) return;
      const rawData = dataLines.join("\n");

      let payload;
      try {
        payload = JSON.parse(rawData);
      } catch (err) {
        payload = rawData;
      }

      if (eventType === "thought") {
        const thoughtText = typeof payload === "object" && payload ? (payload.thought || payload.content || "") : String(payload);
        if (thoughtText && handlers.onThought) handlers.onThought(thoughtText);
      } else if (eventType === "answer") {
        let chunk = "";
        if (typeof payload === "object" && payload) {
          chunk = payload.chunk !== undefined ? payload.chunk : (payload.content !== undefined ? payload.content : "");
        } else {
          chunk = String(payload);
        }
        if (chunk && handlers.onAnswerChunk) handlers.onAnswerChunk(chunk);
      } else if (eventType === "evidence") {
        if (handlers.onEvidence) handlers.onEvidence(payload);
      } else if (eventType === "error") {
        const errMsg = typeof payload === "object" && payload ? (payload.message || payload.error || "服务发生错误") : String(payload);
        if (handlers.onError) handlers.onError(errMsg);
      }
    }

    async function consumeSseStream(response, handlers) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundaryMatch;
        while ((boundaryMatch = buffer.match(/\r?\n\r?\n/)) !== null) {
          const boundaryIndex = boundaryMatch.index;
          const delimiterLength = boundaryMatch[0].length;
          const eventBlock = buffer.slice(0, boundaryIndex);
          buffer = buffer.slice(boundaryIndex + delimiterLength);
          parseAndDispatchSseBlock(eventBlock, handlers);
        }
      }

      if (buffer.trim()) parseAndDispatchSseBlock(buffer, handlers);
    }

    function renderEvidence(container, evidenceList) {
      if (!evidenceList || !Array.isArray(evidenceList) || evidenceList.length === 0) return;
      const titles = evidenceList
        .map(e => e.doc_title || e.title || (e.doc_id ? "文档 " + e.doc_id : ""))
        .filter(Boolean);
      if (titles.length === 0) return;
      container.replaceChildren();
      titles.forEach((title, index) => {
        const chip = document.createElement("span");
        chip.className = "cite";
        chip.textContent = (index + 1) + " · " + title;
        container.appendChild(chip);
      });
    }

    function showTokenNotice() {
      if (document.getElementById("tokenNotice")) return;
      const notice = document.createElement("div");
      notice.className = "notice";
      notice.id = "tokenNotice";

      const title = document.createElement("strong");
      title.textContent = "还没有访问令牌";
      const code = document.createElement("code");
      code.textContent = 'localStorage.setItem("suredesk_access_token", "你的令牌")';

      notice.appendChild(title);
      notice.appendChild(code);
      messagesEl.appendChild(notice);
      scrollToLatest();
      showToast("未检测到访问令牌");
    }

    function createBotStream() {
      const { row, bubble } = createMessage("bot");

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.setAttribute("aria-label", "正在回复");
      for (let i = 0; i < 3; i += 1) typing.appendChild(document.createElement("span"));
      bubble.appendChild(typing);

      const answer = document.createElement("div");
      answer.className = "answer";
      bubble.appendChild(answer);

      const evidence = document.createElement("div");
      evidence.className = "evidence";
      bubble.appendChild(evidence);

      return { row, bubble, typing, answer, evidence };
    }

    function addFeedback(stream, query) {
      const bar = document.createElement("div");
      bar.className = "feedback-bar";

      const up = document.createElement("button");
      up.type = "button";
      up.className = "feedback-btn";
      up.textContent = "有帮助";

      const down = document.createElement("button");
      down.type = "button";
      down.className = "feedback-btn";
      down.textContent = "没解决";

      up.addEventListener("click", () => sendFeedback(true, query, stream.answer.textContent, bar));
      down.addEventListener("click", () => sendFeedback(false, query, stream.answer.textContent, bar));

      bar.appendChild(up);
      bar.appendChild(down);
      stream.bubble.appendChild(bar);
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isSending) return;

      const userId = getAuthenticatedUserId();
      if (!userId) {
        showTokenNotice();
        return;
      }

      hideWelcome();
      inputEl.value = "";
      resizeInput();
      isSending = true;
      sendBtn.disabled = true;
      sendBtn.textContent = "…";

      const userMessage = createMessage("user");
      userMessage.bubble.textContent = text;
      scrollToLatest();

      const stream = createBotStream();
      let accumulatedAnswer = "";
      let receivedChunk = false;
      scrollToLatest();

      try {
        const resp = await fetch("/api/chat/stream", {
          method: "POST",
          headers: getAuthHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            user_id: userId,
            session_id: sessionId,
            query: text,
            stream: true
          })
        });

        if (!resp.ok) throw new Error("HTTP error " + resp.status);

        const contentType = resp.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
          const data = await resp.json();
          if (stream.typing.parentNode) stream.typing.remove();
          accumulatedAnswer = data.answer || "已收到。";
          stream.answer.textContent = accumulatedAnswer;
          if (data.evidence) renderEvidence(stream.evidence, data.evidence);
        } else if (resp.body && resp.body.getReader) {
          await consumeSseStream(resp, {
            onThought: () => {},
            onAnswerChunk: (chunk) => {
              if (!receivedChunk) {
                receivedChunk = true;
                if (stream.typing.parentNode) stream.typing.remove();
              }
              accumulatedAnswer += chunk;
              stream.answer.textContent = accumulatedAnswer;
              scrollToLatest();
            },
            onEvidence: (evidenceList) => {
              renderEvidence(stream.evidence, evidenceList);
              scrollToLatest();
            },
            onError: (errMsg) => {
              if (stream.typing.parentNode) stream.typing.remove();
              stream.answer.textContent = errMsg;
              stream.answer.classList.add("error");
              scrollToLatest();
            }
          });
        }

        if (!accumulatedAnswer && !stream.answer.textContent) {
          accumulatedAnswer = "已收到。";
          stream.answer.textContent = accumulatedAnswer;
        }

        addFeedback(stream, text);
      } catch (err) {
        if (stream.typing.parentNode) stream.typing.remove();
        stream.answer.textContent = "刚才没连上，再试一次。";
        stream.answer.classList.add("error");

        const retry = document.createElement("button");
        retry.type = "button";
        retry.className = "retry";
        retry.textContent = "重试";
        retry.addEventListener("click", () => {
          inputEl.value = text;
          resizeInput();
          sendMessage();
        });
        stream.answer.appendChild(retry);
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        sendBtn.textContent = "发送";
        scrollToLatest();
      }
    }

    async function sendFeedback(useful, query, answer, barElement) {
      const userId = getAuthenticatedUserId();
      if (!userId) {
        showTokenNotice();
        return;
      }
      try {
        const resp = await fetch("/api/feedback", {
          method: "POST",
          headers: getAuthHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            user_id: userId,
            session_id: sessionId,
            query: query,
            answer: answer || "",
            useful: useful
          })
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        if (barElement) {
          barElement.replaceChildren();
          const stamp = document.createElement("span");
          stamp.className = "stamp";
          stamp.textContent = useful ? "已记录" : "已转运营";
          barElement.appendChild(stamp);
        }
        showToast(useful ? "谢谢" : "已收到");
      } catch (err) {
        showToast("提交失败，再试一次");
      }
    }

    function resizeInput() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    }

    inputEl.addEventListener("input", resizeInput);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("composerForm").addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    document.querySelectorAll("[data-prompt]").forEach((button) => {
      button.addEventListener("click", () => {
        inputEl.value = button.getAttribute("data-prompt") || "";
        resizeInput();
        sendMessage();
      });
    });

    resizeInput();
  </script>
</body>
</html>
