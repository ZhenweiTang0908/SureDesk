<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SureDesk · 审核台</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9ede6;
      --surface: #fbfbf7;
      --white: #ffffff;
      --ink: #17211c;
      --muted: #6b776f;
      --line: #d3dbd1;
      --line-strong: #bcc7ba;
      --pine: #1c4a3b;
      --pine-dark: #123126;
      --pine-soft: #e4ece6;
      --signal: #cf4a2f;
      --signal-soft: #f7e5df;
      --amber: #a86f1b;
      --amber-soft: #f6ecd8;
      --serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif CJK SC", serif;
      --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
      --mono: "SF Mono", "Menlo", "Consolas", monospace;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background-color: var(--canvas);
      background-image:
        linear-gradient(rgba(23, 33, 28, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 28, 0.035) 1px, transparent 1px);
      background-size: 34px 34px;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, input { font: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 3px;
    }

    .masthead {
      color: #f3f6f1;
      background-color: var(--pine);
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 18px 18px;
      border-bottom: 4px solid var(--signal);
    }

    .masthead-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: min(1180px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 15px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
      font-family: var(--serif);
      font-size: 21px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1.5px solid rgba(255, 255, 255, 0.72);
      color: #fff;
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1;
      transform: rotate(-3deg);
      box-shadow: inset 0 0 0 3px var(--pine), inset 0 0 0 4px rgba(255, 255, 255, 0.24);
    }

    .brand em {
      color: rgba(243, 246, 241, 0.62);
      font-family: var(--sans);
      font-size: 12px;
      font-style: normal;
    }

    .masthead a.back {
      color: #fff;
      font-size: 12px;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      padding-bottom: 2px;
    }

    .masthead a.back:hover { border-bottom-color: #fff; }

    .page {
      width: min(1180px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 30px 0 44px;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .page-head h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(32px, 4vw, 44px);
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .count {
      display: grid;
      place-items: center;
      min-width: 56px;
      height: 56px;
      padding: 0 10px;
      border: 1.5px solid var(--signal);
      border-radius: 50%;
      color: var(--signal);
      font-family: var(--serif);
      font-size: 27px;
      line-height: 1;
      transform: rotate(3deg);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.9fr);
      gap: 18px;
      align-items: start;
    }

    .queue {
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--white);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .tab {
      padding: 7px 8px 6px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: none;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab span {
      margin-left: 3px;
      color: #8a958e;
      font-family: var(--mono);
      font-size: 10px;
    }

    .tab:hover { color: var(--ink); }
    .tab.is-active { border-bottom-color: var(--signal); color: var(--ink); }

    .search {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 6px;
      min-width: 100px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
    }

    .search svg { flex: 0 0 13px; width: 13px; height: 13px; color: var(--muted); }

    .search input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 12px;
    }

    .search input::placeholder { color: #8c9790; }

    .refresh {
      display: grid;
      flex: 0 0 30px;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    .refresh svg { width: 14px; height: 14px; }
    .refresh:hover { border-color: var(--pine); }
    .refresh.is-loading svg { animation: spin 900ms linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .problem-list { min-height: 260px; }

    .problem-row {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-left: 3px solid transparent;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .problem-row:last-child { border-bottom: 0; }
    .problem-row:hover { background: #f5f8f3; }

    .problem-row.is-selected {
      border-left-color: var(--signal);
      background: var(--pine-soft);
    }

    .row-top {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 7px;
    }

    .row-time {
      margin-left: auto;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border: 1px solid;
      border-radius: 2px;
      font-size: 10px;
      line-height: 1.5;
      white-space: nowrap;
    }

    .badge.gate { border-color: #e2b6a9; background: var(--signal-soft); color: #9c3521; }
    .badge.thumb { border-color: #dfc492; background: var(--amber-soft); color: #7e5414; }
    .badge.self { border-color: #b9cbbd; background: var(--pine-soft); color: var(--pine); }

    .row-query {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.55;
    }

    .detail {
      position: sticky;
      top: 18px;
      min-height: 380px;
      border: 1px solid var(--line);
      background: var(--white);
      overflow: hidden;
      animation: panel-in 260ms cubic-bezier(0.22, 0.8, 0.3, 1) both;
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 380px;
      gap: 14px;
    }

    .empty-mark {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border: 1px dashed var(--line-strong);
      border-radius: 50%;
      color: var(--pine);
      font-family: var(--serif);
      font-size: 25px;
      transform: rotate(-4deg);
    }

    .detail-empty p {
      margin: 0;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 18px;
    }

    .detail-content { padding: 20px 24px 24px; }

    .detail-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .detail-top .row-time { font-size: 10px; }

    .detail-query {
      margin: 0;
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 500;
      line-height: 1.35;
    }

    .detail-rewrite {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .detail-rewrite::before {
      content: "↳ ";
      color: var(--signal);
    }

    .detail-rewrite[hidden] { display: none; }

    .original {
      margin: 18px 0 16px;
      color: var(--muted);
      font-size: 11px;
    }

    .original summary { cursor: pointer; }

    .original p {
      margin: 8px 0 0;
      padding: 10px;
      border-left: 2px solid var(--line);
      background: #f7f8f4;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    #answerInput {
      display: block;
      width: 100%;
      min-height: 130px;
      padding: 11px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      outline: 0;
      resize: vertical;
      background: #fff;
      font-size: 13px;
      line-height: 1.65;
    }

    #answerInput:focus { border-color: var(--pine); }
    #answerInput::placeholder { color: #8c9790; }

    .detail-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 12px;
    }

    .btn {
      padding: 9px 15px;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      border: 1px solid var(--pine-dark);
      background: var(--pine);
      color: #fff;
      font-weight: 600;
    }

    .btn-primary:hover { background: var(--pine-dark); }
    .btn-primary:disabled { opacity: 0.55; cursor: progress; }

    .btn-quiet {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--muted);
    }

    .btn-quiet:hover { border-color: var(--muted); color: var(--ink); }

    .adopt-stamp {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(251, 251, 247, 0.93);
      color: var(--pine);
      font-family: var(--serif);
      font-size: 46px;
      letter-spacing: 0.08em;
      opacity: 0;
      pointer-events: none;
      transform: rotate(-5deg) scale(0.75);
    }

    .adopt-stamp.is-visible {
      animation: big-stamp 900ms cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
    }

    @keyframes big-stamp {
      0% { opacity: 0; transform: rotate(-5deg) scale(1.25); }
      25% { opacity: 1; transform: rotate(-5deg) scale(1); }
      75% { opacity: 1; transform: rotate(-5deg) scale(1); }
      100% { opacity: 0; transform: rotate(-5deg) scale(1.02); }
    }

    .skeleton-row {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .sk {
      display: block;
      height: 10px;
      margin-bottom: 9px;
      background: #edf0ea;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    .sk-sm { width: 22%; }
    .sk-md { width: 72%; }
    .sk-lg { width: 90%; }

    @keyframes shimmer {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .list-empty, .list-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      gap: 14px;
      padding: 30px;
    }

    .list-empty .empty-mark { border-style: solid; }

    .list-empty p, .list-error p {
      margin: 0;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 18px;
      text-align: center;
    }

    .list-error p { font-family: var(--sans); font-size: 12px; }

    .list-error button {
      padding: 7px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      z-index: 20;
      padding: 10px 16px;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .detail { position: static; }
    }

    @media (max-width: 640px) {
      body { background-image: none; }
      .masthead-inner, .page { width: calc(100vw - 32px); }
      .brand em { display: none; }
      .page { padding-top: 22px; }
      .page-head h1 { font-size: 32px; }
      .count { min-width: 46px; height: 46px; font-size: 22px; }
      .toolbar { flex-wrap: wrap; }
      .search { order: 3; flex-basis: 100%; }
      .detail-content { padding: 18px; }
      .detail-query { font-size: 22px; }
    }

    @media (max-width: 420px) {
      .tabs { gap: 0; }
      .tab { padding-left: 4px; padding-right: 4px; }
      .tab span { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="/chat">
        <span class="brand-mark" aria-hidden="true">S</span>
        SureDesk<em>审核台</em>
      </a>
      <a class="back" href="/chat">买家端</a>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <h1>审核队列</h1>
      <div class="count" id="statPending" aria-label="待审核数量">—</div>
    </div>

    <section class="workspace">
      <div class="queue">
        <div class="toolbar">
          <div class="tabs" role="tablist" aria-label="筛选">
            <button class="tab is-active" data-filter="ALL" role="tab" aria-selected="true">全部 <span id="tabAllCount">—</span></button>
            <button class="tab" data-filter="CONFIDENCE_GATE" role="tab" aria-selected="false">拦截 <span id="tabGateCount">—</span></button>
            <button class="tab" data-filter="USER_THUMBS_DOWN" role="tab" aria-selected="false">负反馈 <span id="tabThumbCount">—</span></button>
          </div>
          <label class="search">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.3"/>
              <path d="m10.4 10.4 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <input id="searchInput" type="search" placeholder="搜索" aria-label="搜索">
          </label>
          <button class="refresh" id="refreshBtn" aria-label="刷新">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.8V6h-3.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="problem-list" id="problemList">
          <div class="skeleton-row"><span class="sk sk-sm"></span><span class="sk sk-lg"></span><span class="sk sk-md"></span></div>
          <div class="skeleton-row"><span class="sk sk-sm"></span><span class="sk sk-lg"></span><span class="sk sk-md"></span></div>
          <div class="skeleton-row"><span class="sk sk-sm"></span><span class="sk sk-lg"></span><span class="sk sk-md"></span></div>
        </div>
      </div>

      <aside class="detail" id="detailPanel" aria-label="审核详情">
        <div class="detail-empty" id="detailEmpty">
          <div class="empty-mark" aria-hidden="true">待</div>
          <p>未选择</p>
        </div>

        <div class="detail-content" id="detailContent" hidden>
          <div class="detail-top">
            <span class="badge" id="detailBadge"></span>
            <span class="row-time" id="detailTime"></span>
          </div>
          <h2 class="detail-query" id="detailQuery"></h2>
          <p class="detail-rewrite" id="detailRewrite"></p>
          <details class="original" id="originalBlock">
            <summary>原始回答</summary>
            <p id="detailAnswer"></p>
          </details>
          <textarea id="answerInput" rows="6" placeholder="标准答案" aria-label="标准答案"></textarea>
          <div class="detail-actions">
            <button class="btn btn-primary" id="adoptBtn">采纳</button>
            <button class="btn btn-quiet" id="ignoreBtn">忽略</button>
          </div>
        </div>

        <div class="adopt-stamp" id="adoptStamp" aria-hidden="true">已入库</div>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const listEl = document.getElementById("problemList");
    const searchInput = document.getElementById("searchInput");
    const refreshBtn = document.getElementById("refreshBtn");
    const toastEl = document.getElementById("toast");
    const detailEmpty = document.getElementById("detailEmpty");
    const detailContent = document.getElementById("detailContent");
    const detailBadge = document.getElementById("detailBadge");
    const detailTime = document.getElementById("detailTime");
    const detailQuery = document.getElementById("detailQuery");
    const detailRewrite = document.getElementById("detailRewrite");
    const originalBlock = document.getElementById("originalBlock");
    const detailAnswer = document.getElementById("detailAnswer");
    const answerInput = document.getElementById("answerInput");
    const adoptBtn = document.getElementById("adoptBtn");
    const ignoreBtn = document.getElementById("ignoreBtn");
    const adoptStamp = document.getElementById("adoptStamp");

    const state = {
      problems: [],
      filter: "ALL",
      search: "",
      selectedId: null
    };
    const drafts = {};
    let toastTimer = null;

    function getAuthHeaders(customHeaders = {}) {
      const headers = Object.assign({}, customHeaders);
      const token = localStorage.getItem("suredesk_access_token");
      if (token) {
        headers["Authorization"] = "Bearer " + token;
      }
      return headers;
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("is-visible"), 3000);
    }

    function triggerLabel(type) {
      if (type === "CONFIDENCE_GATE") return "置信度拦截";
      if (type === "USER_THUMBS_DOWN") return "用户负反馈";
      if (type === "SELF_EVAL_FAIL") return "自评未过";
      return "待分类";
    }

    function triggerClass(type) {
      if (type === "CONFIDENCE_GATE") return "gate";
      if (type === "USER_THUMBS_DOWN") return "thumb";
      return "self";
    }

    function makeBadge(type) {
      const badge = document.createElement("span");
      badge.className = "badge " + triggerClass(type);
      badge.textContent = triggerLabel(type);
      return badge;
    }

    function formatTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }

    function updateCounts() {
      const total = state.problems.length;
      const gate = state.problems.filter(p => p.trigger_type === "CONFIDENCE_GATE").length;
      const thumb = state.problems.filter(p => p.trigger_type === "USER_THUMBS_DOWN").length;
      document.getElementById("statPending").textContent = total;
      document.getElementById("statPending").setAttribute("aria-label", total + " 条待审核");
      document.getElementById("tabAllCount").textContent = total;
      document.getElementById("tabGateCount").textContent = gate;
      document.getElementById("tabThumbCount").textContent = thumb;
    }

    function renderSkeletons() {
      listEl.replaceChildren();
      for (let i = 0; i < 4; i += 1) {
        const row = document.createElement("div");
        row.className = "skeleton-row";
        ["sk-sm", "sk-lg", "sk-md"].forEach((size) => {
          const line = document.createElement("span");
          line.className = "sk " + size;
          row.appendChild(line);
        });
        listEl.appendChild(row);
      }
    }

    function renderError(message) {
      listEl.replaceChildren();
      const box = document.createElement("div");
      box.className = "list-error";
      const copy = document.createElement("p");
      copy.textContent = message;
      const retry = document.createElement("button");
      retry.textContent = "重试";
      retry.addEventListener("click", loadProblems);
      box.appendChild(copy);
      box.appendChild(retry);
      listEl.appendChild(box);
    }

    function renderList() {
      const query = state.search.trim().toLowerCase();
      const filtered = state.problems.filter((problem) => {
        const matchesFilter = state.filter === "ALL" || problem.trigger_type === state.filter;
        const haystack = ((problem.query || "") + " " + (problem.rewritten_query || "")).toLowerCase();
        return matchesFilter && (!query || haystack.includes(query));
      });

      listEl.replaceChildren();

      if (filtered.length === 0) {
        const box = document.createElement("div");
        box.className = "list-empty";
        const mark = document.createElement("div");
        mark.className = "empty-mark";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = "空";
        const copy = document.createElement("p");
        copy.textContent = state.problems.length === 0 ? "队列空了" : "没有匹配";
        box.appendChild(mark);
        box.appendChild(copy);
        listEl.appendChild(box);
        return;
      }

      filtered.forEach((problem) => {
        const row = document.createElement("button");
        row.className = "problem-row" + (problem.id === state.selectedId ? " is-selected" : "");
        row.type = "button";
        row.setAttribute("aria-pressed", problem.id === state.selectedId ? "true" : "false");

        const top = document.createElement("div");
        top.className = "row-top";
        top.appendChild(makeBadge(problem.trigger_type));

        const time = document.createElement("span");
        time.className = "row-time";
        time.textContent = formatTime(problem.created_at);
        top.appendChild(time);

        const question = document.createElement("p");
        question.className = "row-query";
        question.textContent = problem.query || "未记录";

        row.appendChild(top);
        row.appendChild(question);

        row.addEventListener("click", () => selectProblem(problem.id));
        listEl.appendChild(row);
      });
    }

    function renderDetail(problem) {
      detailEmpty.hidden = true;
      detailContent.hidden = false;

      detailBadge.className = "badge " + triggerClass(problem.trigger_type);
      detailBadge.textContent = triggerLabel(problem.trigger_type);
      detailTime.textContent = formatTime(problem.created_at);
      detailQuery.textContent = problem.query || "未记录";

      if (problem.rewritten_query) {
        detailRewrite.hidden = false;
        detailRewrite.textContent = problem.rewritten_query;
      } else {
        detailRewrite.hidden = true;
        detailRewrite.textContent = "";
      }

      if (problem.answer) {
        originalBlock.hidden = false;
        detailAnswer.textContent = problem.answer;
      } else {
        originalBlock.hidden = true;
        detailAnswer.textContent = "";
      }

      const draft = drafts[problem.id];
      answerInput.value = draft !== undefined ? draft : (problem.standard_answer || "");
      adoptBtn.disabled = false;
      ignoreBtn.disabled = false;
    }

    function selectProblem(id) {
      state.selectedId = id;
      renderList();
      const problem = state.problems.find(item => item.id === id);
      if (problem) renderDetail(problem);
    }

    async function loadProblems() {
      refreshBtn.classList.add("is-loading");
      refreshBtn.disabled = true;
      renderSkeletons();

      try {
        const res = await fetch("/api/workbench/problems?status=PENDING", {
          headers: getAuthHeaders()
        });

        if (!res.ok) {
          if (res.status === 401 || res.status === 403) {
            throw new Error("需要运营角色令牌");
          }
          throw new Error("加载失败 " + res.status);
        }

        const data = await res.json();
        state.problems = Array.isArray(data.problems) ? data.problems : [];

        const stillExists = state.problems.some(item => item.id === state.selectedId);
        if (!stillExists) {
          state.selectedId = state.problems.length > 0 ? state.problems[0].id : null;
        }

        updateCounts();
        renderList();

        if (state.selectedId) {
          const problem = state.problems.find(item => item.id === state.selectedId);
          if (problem) renderDetail(problem);
        } else {
          detailEmpty.hidden = false;
          detailContent.hidden = true;
        }
      } catch (err) {
        renderError(err && err.message ? err.message : "加载失败");
      } finally {
        refreshBtn.classList.remove("is-loading");
        refreshBtn.disabled = false;
      }
    }

    async function adoptProblem(id, textareaElement) {
      const answer = (textareaElement ? textareaElement.value : answerInput.value).trim();
      if (!answer) {
        showToast("先写答案");
        answerInput.focus();
        return;
      }

      adoptBtn.disabled = true;
      try {
        const res = await fetch("/api/workbench/adopt", {
          method: "POST",
          headers: getAuthHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ problem_id: id, standard_answer: answer })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        adoptStamp.classList.remove("is-visible");
        void adoptStamp.offsetWidth;
        adoptStamp.classList.add("is-visible");
        delete drafts[id];
        state.selectedId = null;
        showToast("已采纳");
        setTimeout(() => {
          adoptStamp.classList.remove("is-visible");
          loadProblems();
        }, 850);
      } catch (err) {
        adoptBtn.disabled = false;
        showToast("提交失败");
      }
    }

    async function ignoreProblem(id) {
      ignoreBtn.disabled = true;
      try {
        const res = await fetch("/api/workbench/ignore", {
          method: "POST",
          headers: getAuthHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ problem_id: id })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        delete drafts[id];
        state.selectedId = null;
        showToast("已忽略");
        loadProblems();
      } catch (err) {
        ignoreBtn.disabled = false;
        showToast("操作失败");
      }
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        state.filter = tab.getAttribute("data-filter") || "ALL";
        document.querySelectorAll(".tab").forEach((item) => {
          const active = item === tab;
          item.classList.toggle("is-active", active);
          item.setAttribute("aria-selected", active ? "true" : "false");
        });
        renderList();
      });
    });

    searchInput.addEventListener("input", () => {
      state.search = searchInput.value;
      renderList();
    });

    refreshBtn.addEventListener("click", loadProblems);

    answerInput.addEventListener("input", () => {
      if (state.selectedId) drafts[state.selectedId] = answerInput.value;
    });

    adoptBtn.addEventListener("click", () => {
      if (state.selectedId) adoptProblem(state.selectedId, answerInput);
    });

    ignoreBtn.addEventListener("click", () => {
      if (state.selectedId) ignoreProblem(state.selectedId);
    });

    loadProblems();
  </script>
</body>
</html>
